name: payments
recipe: symfony
services:
    selenium:
        type: compose
        app_mount: false
        services:
            image: selenium/standalone-chrome:4.27.0
            shm_size: 2gb
            ports:
                - '4444:4444'
            # Lando overrides the image entrypoint; restore Selenium's default.
            command: /opt/bin/entry_point.sh
    appserver:
        overrides:
            environment:
                # Selenium hostname is only valid inside the Lando Docker network.
                BEHAT_PARAMS: '{"extensions":{"Behat\\MinkExtension":{"sessions":{"javascript":{"webdriver_classic":{"wd_host":"http://selenium:4444"}}}}}}'
        build_as_root:
            - rm -f /etc/apt/sources.list.d/mariadb*.list || true
            - sed -i '/mirror\.mariadb\.org/d' /etc/apt/sources.list || true
            # Bullseye LTS has ended; deb.debian.org/debian-security 404s on packages. Use the archive instead
            # (the base image already has security-updated libs like libxml2, so we need those versions available).
            - grep -rlE 'deb\.debian\.org/debian-security|security\.debian\.org' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sed -i -E '/debian-security|security\.debian\.org/ s#https?://(deb|security)\.debian\.org(/debian-security)?#http://archive.debian.org/debian-security#'
            - echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
            - apt-get update -y
            - docker-php-ext-install sockets
            - apt-get install -y libxslt1-dev
            - docker-php-ext-install xsl
            - apt-get install -y --no-install-recommends mariadb-client || true

    node:
        type: node:22
        build:
            - npm install
            - npm run build
config:
    php: '7.4'
    via: apache:2.4
    webroot: ./public
    xdebug: false
tooling:
    npm:
        service: node
    node:
        service: node
    yarn:
        service: node
    behat:
        service: appserver
        cmd: vendor/bin/behat
        description: Run Behat (pass paths/flags after --)
