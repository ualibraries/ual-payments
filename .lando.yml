name: payments
recipe: symfony
services:
    selenium:
        type: compose
        app_mount: false
        services:
            image: selenium/standalone-chrome:4.27.0
            shm_size: 2gb
            ports:
                - '4444:4444'
            # Lando overrides the image entrypoint; restore Selenium's default.
            command: /opt/bin/entry_point.sh

    appserver:
        overrides:
            environment:
                # Selenium hostname is only valid inside the Lando Docker network.
                BEHAT_PARAMS: '{"extensions":{"Behat\\MinkExtension":{"sessions":{"javascript":{"webdriver_classic":{"wd_host":"http://selenium:4444"}}}}}}'
        build_as_root:
            - rm -f /etc/apt/sources.list.d/mariadb*.list || true
            - sed -i '/mirror\.mariadb\.org/d' /etc/apt/sources.list || true
            - apt-get update -y
            - apt-get install -y libcurl4-openssl-dev libzip-dev pkg-config
            - docker-php-ext-install curl zip sockets
            - apt-get install -y libxslt1-dev
            - docker-php-ext-install xsl
            - apt-get install -y --no-install-recommends mariadb-client || true
            - apt-get install -y ca-certificates curl gnupg
            - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            - apt-get install -y nodejs
            - corepack enable
        build:
            - npm install
            - npm run build

config:
    php: '7.4'
    via: apache:2.4
    webroot: ./public
    xdebug: false
tooling:
    npm:
        service: appserver
    node:
        service: appserver
    behat:
        service: appserver
        cmd: vendor/bin/behat
        description: Run Behat (pass paths/flags after --)
    yarn:
        service: appserver
