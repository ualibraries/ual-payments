name: payments
recipe: symfony
services:
    appserver:
        build_as_root:
            - rm -f /etc/apt/sources.list.d/mariadb*.list || true
            - sed -i '/mirror\.mariadb\.org/d' /etc/apt/sources.list || true
            - apt-get update -y
            - docker-php-ext-install sockets
            - apt-get install -y libxslt1-dev
            - docker-php-ext-install xsl
            - apt-get install -y --no-install-recommends mariadb-client || true
            - apt-get install -y ca-certificates curl gnupg
            - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            - apt-get install -y nodejs
            - corepack enable
        build:
            - npm install
            - npm run build

config:
    php: '7.4'
    via: apache:2.4
    webroot: ./public
    xdebug: false
tooling:
    npm:
        service: appserver
    node:
        service: appserver
    behat:
        service: appserver
        cmd: vendor/bin/behat
        description: Run Behat (pass paths/flags after --)
    yarn:
        service: appserver
